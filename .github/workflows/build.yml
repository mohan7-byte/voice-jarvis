          package com.gemini.live;

          import android.os.Handler;
          import android.os.Looper;
          import android.util.Base64;
          import okhttp3.OkHttpClient;
          import okhttp3.Request;
          import okhttp3.Response;
          import okhttp3.WebSocket;
          import okhttp3.WebSocketListener;
          import org.json.JSONArray;
          import org.json.JSONObject;

          public class GeminiLiveClient {
              public interface LiveCallback {
                  void onConnected();
                  void onModelSpeaking();
                  void onTurnComplete();
                  void onToolCall(String name, JSONObject args, String callId);
                  void onClosed(String reason);
              }

              private WebSocket webSocket;
              private OkHttpClient client;
              private LiveCallback callback;
              private Handler mainHandler = new Handler(Looper.getMainLooper());
              private boolean isSetupComplete = false;

              public GeminiLiveClient(LiveCallback callback) {
                  this.callback = callback;
                  // Explicitly NO pingInterval: Google's Live API backend drops sockets if client sends WS pings
                  this.client = new OkHttpClient.Builder()
                      .retryOnConnectionFailure(true)
                      .build();
              }

              public void connect(String apiKey, String model, String voice, String prompt) {
                  isSetupComplete = false;
                  String url = "wss://generativelanguage.googleapis.com/ws/google.ai.generativelanguage.v1beta.GenerativeService.BidiGenerateContent?key=" + apiKey.trim();
                  Request request = new Request.Builder().url(url).build();

                  webSocket = client.newWebSocket(request, new WebSocketListener() {
                      @Override
                      public void onOpen(WebSocket ws, Response response) {
                          sendSetup(ws, model, voice, prompt);
                      }

                      @Override
                      public void onMessage(WebSocket ws, String text) {
                          handleIncomingJson(text);
                      }

                      @Override
                      public void onClosed(WebSocket ws, int code, String reason) {
                          mainHandler.post(() -> { if (callback != null) callback.onClosed("Closed (" + code + "): " + reason); });
                      }

                      @Override
                      public void onFailure(WebSocket ws, Throwable t, Response response) {
                          mainHandler.post(() -> { if (callback != null) callback.onClosed("Error: " + t.getMessage()); });
                      }
                  });
              }

              private void sendSetup(WebSocket ws, String model, String voice, String prompt) {
                  try {
                      JSONObject setup = new JSONObject();
                      String cleanModel = model.startsWith("models/") ? model : "models/" + model;
                      setup.put("model", cleanModel.trim());

                      JSONObject genConfig = new JSONObject();
                      JSONArray modalities = new JSONArray();
                      modalities.put("AUDIO");
                      genConfig.put("responseModalities", modalities);

                      JSONObject speechConfig = new JSONObject();
                      JSONObject voiceConfig = new JSONObject();
                      JSONObject prebuilt = new JSONObject();
                      prebuilt.put("voiceName", voice);
                      voiceConfig.put("prebuiltVoiceConfig", prebuilt);
                      speechConfig.put("voiceConfig", voiceConfig);
                      genConfig.put("speechConfig", speechConfig);
                      setup.put("generationConfig", genConfig);

                      if (prompt != null && !prompt.trim().isEmpty()) {
                          JSONObject sysInst = new JSONObject();
                          JSONArray parts = new JSONArray();
                          parts.put(new JSONObject().put("text", prompt.trim()));
                          sysInst.put("parts", parts);
                          setup.put("systemInstruction", sysInst);
                      }

                      setup.put("tools", getDeviceToolDeclarations());
                      ws.send(new JSONObject().put("setup", setup).toString());
                  } catch (Exception ignored) {}
              }

              private JSONArray getDeviceToolDeclarations() throws Exception {
                  JSONArray tools = new JSONArray();
                  JSONObject toolObj = new JSONObject();
                  JSONArray declarations = new JSONArray();

                  declarations.put(makeDecl("create_note", "Instant zero-failure note creation via Android intent", "text", "The note content"));
                  declarations.put(makeDecl("type_text", "Insert text into the active field or open note", "text", "The text to write"));
                  declarations.put(makeCoordDecl("tap_coordinates", "Physically tap screen. Normalized 0 to 1000 coordinates (x=500,y=500 is center)"));
                  declarations.put(makeCoordDecl("long_press", "Long press screen for 700ms at normalized 0 to 1000 coordinates"));
                  declarations.put(makeDecl("tap_element", "Click UI element matching a label or description", "label", "Label of the button"));
                  declarations.put(makeSimpleDecl("scroll", "Scroll screen up or down", "direction", "down or up"));
                  declarations.put(makeSimpleDecl("read_screen_text", "Read visible screen text and interactive elements catalog", null, null));
                  declarations.put(makeSimpleDecl("capture_screen", "Capture crisp 1:1 screenshot to visually analyze buttons", null, null));
                  declarations.put(makeSimpleDecl("open_application", "Launch an installed app by name", "app_name", "Name of the app"));
                  declarations.put(makeSimpleDecl("search_contacts", "Search contact phone number by name", "query", "Contact name"));
                  declarations.put(makeSimpleDecl("search_youtube", "Open YouTube searching for video", "query", "Search term"));
                  declarations.put(makeSimpleDecl("search_web", "Open Google search in browser", "query", "Search term"));
                  declarations.put(makeSimpleDecl("open_whatsapp", "Open WhatsApp chat", "phone_number", "Phone number"));
                  declarations.put(makeSimpleDecl("make_phone_call", "Call a phone number", "phone_number", "Phone number"));
                  declarations.put(makeSimpleDecl("toggle_flashlight", "Turn flashlight on or off", "state", "true or false"));

                  toolObj.put("functionDeclarations", declarations);
                  tools.put(toolObj);
                  return tools;
              }

              private JSONObject makeDecl(String name, String desc, String param, String paramDesc) throws Exception {
                  JSONObject decl = new JSONObject();
                  decl.put("name", name);
                  decl.put("description", desc);
                  JSONObject params = new JSONObject();
                  params.put("type", "OBJECT");
                  JSONObject props = new JSONObject();
                  props.put(param, new JSONObject().put("type", "STRING").put("description", paramDesc));
                  params.put("properties", props);
                  params.put("required", new JSONArray().put(param));
                  decl.put("parameters", params);
                  return decl;
              }

              private JSONObject makeSimpleDecl(String name, String desc, String param, String paramDesc) throws Exception {
                  JSONObject decl = new JSONObject();
                  decl.put("name", name);
                  decl.put("description", desc);
                  JSONObject params = new JSONObject();
                  params.put("type", "OBJECT");
                  JSONObject props = new JSONObject();
                  if (param != null) {
                      props.put(param, new JSONObject().put("type", "STRING").put("description", paramDesc));
                      params.put("required", new JSONArray().put(param));
                  }
                  params.put("properties", props);
                  decl.put("parameters", params);
                  return decl;
              }

              private JSONObject makeCoordDecl(String name, String desc) throws Exception {
                  JSONObject decl = new JSONObject();
                  decl.put("name", name);
                  decl.put("description", desc);
                  JSONObject params = new JSONObject();
                  params.put("type", "OBJECT");
                  JSONObject props = new JSONObject();
                  props.put("x", new JSONObject().put("type", "INTEGER").put("description", "X coordinate 0 to 1000"));
                  props.put("y", new JSONObject().put("type", "INTEGER").put("description", "Y coordinate 0 to 1000"));
                  params.put("properties", props);
                  JSONArray req = new JSONArray();
                  req.put("x"); req.put("y");
                  params.put("required", req);
                  decl.put("parameters", params);
                  return decl;
              }

              // Do not send audio until setupComplete is received!
              public void sendAudioChunk(String base64Pcm) {
                  if (webSocket == null || !isSetupComplete) return;
                  try {
                      JSONObject real = new JSONObject();
                      JSONArray mediaChunks = new JSONArray();
                      JSONObject chunk = new JSONObject();
                      chunk.put("data", base64Pcm);
                      chunk.put("mimeType", "audio/pcm;rate=16000");
                      mediaChunks.put(chunk);
                      real.put("mediaChunks", mediaChunks);
                      webSocket.send(new JSONObject().put("realtimeInput", real).toString());
                  } catch (Exception ignored) {}
              }

              public void sendImageFrame(String base64Jpeg) {
                  if (webSocket == null || !isSetupComplete) return;
                  try {
                      JSONObject real = new JSONObject();
                      JSONArray mediaChunks = new JSONArray();
                      JSONObject chunk = new JSONObject();
                      chunk.put("data", base64Jpeg);
                      chunk.put("mimeType", "image/jpeg");
                      mediaChunks.put(chunk);
                      real.put("mediaChunks", mediaChunks);
                      webSocket.send(new JSONObject().put("realtimeInput", real).toString());
                  } catch (Exception ignored) {}
              }

              public void sendToolResponse(String callId, String result) {
                  if (webSocket == null) return;
                  try {
                      JSONObject toolResp = new JSONObject();
                      JSONArray funcResponses = new JSONArray();
                      JSONObject respObj = new JSONObject();
                      respObj.put("id", callId);
                      respObj.put("response", new JSONObject().put("output", new JSONObject().put("result", result)));
                      funcResponses.put(respObj);
                      toolResp.put("functionResponses", funcResponses);
                      webSocket.send(new JSONObject().put("toolResponse", toolResp).toString());
                  } catch (Exception ignored) {}
              }

              private void handleIncomingJson(String jsonStr) {
                  try {
                      JSONObject res = new JSONObject(jsonStr);

                      // Gate audio: setupComplete confirms Google accepts session
                      if (res.has("setupComplete")) {
                          isSetupComplete = true;
                          mainHandler.post(() -> {
                              if (callback != null) callback.onConnected();
                          });
                          return;
                      }

                      if (res.has("toolCall")) {
                          JSONObject toolCall = res.getJSONObject("toolCall");
                          JSONArray calls = toolCall.optJSONArray("functionCalls");
                          if (calls != null) {
                              for (int i = 0; i < calls.length(); i++) {
                                  JSONObject c = calls.getJSONObject(i);
                                  String name = c.getString("name");
                                  JSONObject args = c.optJSONObject("args");
                                  String id = c.optString("id", "call_1");
                                  mainHandler.post(() -> {
                                      if (callback != null) callback.onToolCall(name, args, id);
                                  });
                              }
                          }
                      }

                      if (res.has("serverContent")) {
                          JSONObject sc = res.getJSONObject("serverContent");
                          if (sc.optBoolean("interrupted", false)) {
                              mainHandler.post(() -> {
                                  if (VolumeTriggerService.instance != null) {
                                      VolumeTriggerService.instance.getAudioEngine().stopPlayback();
                                  }
                              });
                          }

                          JSONObject modelTurn = sc.optJSONObject("modelTurn");
                          if (modelTurn != null) {
                              JSONArray parts = modelTurn.optJSONArray("parts");
                              if (parts != null) {
                                  for (int i = 0; i < parts.length(); i++) {
                                      JSONObject p = parts.getJSONObject(i);
                                      JSONObject inline = p.optJSONObject("inlineData");
                                      String b64 = inline != null ? inline.optString("data") : p.optString("data");
                                      if (b64 != null && !b64.isEmpty()) {
                                          byte[] pcm = Base64.decode(b64, Base64.NO_WRAP);
                                          if (VolumeTriggerService.instance != null) {
                                              VolumeTriggerService.instance.getAudioEngine().playPcmChunk(pcm);
                                              mainHandler.post(() -> { if (callback != null) callback.onModelSpeaking(); });
                                          }
                                      }
                                  }
                              }
                          }

                          if (sc.optBoolean("turnComplete", false)) {
                              mainHandler.post(() -> { if (callback != null) callback.onTurnComplete(); });
                          }
                      }
                  } catch (Exception ignored) {}
              }

              public void disconnect() {
                  isSetupComplete = false;
                  if (webSocket != null) {
                      webSocket.close(1000, "Clean close");
                      webSocket = null;
                  }
              }
          }
