          public class FloatingPillManager {
              public enum State { IDLE, LISTENING, WORKING, SPEAKING }

              private Context context;
              private WindowManager windowManager;
              private LinearLayout pillContainer;
              private View orbView;
              private TextView statusText;
              private TextView subText;
              private TextView actionBtn;
              private boolean isAttached = false;
              private Handler mainHandler = new Handler(Looper.getMainLooper());

              public FloatingPillManager(Context context) {
                  this.context = context;
                  this.windowManager = (WindowManager) context.getSystemService(Context.WINDOW_SERVICE);
                  buildPillView();
              }

              private void buildPillView() {
                  pillContainer = new LinearLayout(context);
                  pillContainer.setOrientation(LinearLayout.HORIZONTAL);
                  pillContainer.setGravity(Gravity.CENTER_VERTICAL);
                  int pV = dp(8), pH = dp(14);
                  pillContainer.setPadding(pH, pV, pH, pV);

                  // Native Capsule Background (Dark blur look)
                  GradientDrawable bg = new GradientDrawable();
                  bg.setColor(Color.parseColor("#0D101A"));
                  bg.setCornerRadius(dp(999));
                  bg.setStroke(dp(1), Color.parseColor("#2A3042"));
                  pillContainer.setBackground(bg);

                  // Glowing Orb Indicator
                  orbView = new View(context);
                  LinearLayout.LayoutParams orbLp = new LinearLayout.LayoutParams(dp(22), dp(22));
                  orbLp.setMargins(0, 0, dp(10), 0);
                  orbView.setLayoutParams(orbLp);
                  setOrbColor(Color.parseColor("#4338CA"));
                  pillContainer.addView(orbView);

                  // Texts Container
                  LinearLayout textCol = new LinearLayout(context);
                  textCol.setOrientation(LinearLayout.VERTICAL);
                  textCol.setGravity(Gravity.CENTER_VERTICAL);
                  LinearLayout.LayoutParams textLp = new LinearLayout.LayoutParams(0, LinearLayout.LayoutParams.WRAP_CONTENT, 1.0f);
                  textCol.setLayoutParams(textLp);

                  statusText = new TextView(context);
                  statusText.setText("Voice");
                  statusText.setTextColor(Color.WHITE);
                  statusText.setTextSize(13);
                  textCol.addView(statusText);

                  subText = new TextView(context);
                  subText.setText("Ready");
                  subText.setTextColor(Color.parseColor("#94A3B8"));
                  subText.setTextSize(10);
                  textCol.addView(subText);
                  pillContainer.addView(textCol);

                  // Quick Action / Start Button
                  actionBtn = new TextView(context);
                  actionBtn.setText("Start");
                  actionBtn.setTextColor(Color.WHITE);
                  actionBtn.setTextSize(11);
                  actionBtn.setPadding(dp(12), dp(6), dp(12), dp(6));
                  GradientDrawable btnBg = new GradientDrawable();
                  btnBg.setColor(Color.parseColor("#4338CA"));
                  btnBg.setCornerRadius(dp(999));
                  actionBtn.setBackground(btnBg);
                  pillContainer.addView(actionBtn);

                  actionBtn.setOnClickListener(v -> {
                      if (VolumeTriggerService.instance != null) {
                          VolumeTriggerService.instance.toggleAssistantSession();
                      }
                  });

                  pillContainer.setOnLongClickListener(v -> {
                      Intent intent = new Intent(context, SettingsActivity.class);
                      intent.addFlags(Intent.FLAG_ACTIVITY_NEW_TASK);
                      context.startActivity(intent);
                      return true;
                  });
              }

              private void setOrbColor(int color) {
                  GradientDrawable orbBg = new GradientDrawable();
                  orbBg.setColor(color);
                  orbBg.setCornerRadius(dp(999));
                  orbView.setBackground(orbBg);
              }

              public void show() {
                  mainHandler.post(() -> {
                      if (isAttached) return;
                      // Physically only 56dp height - REST OF SCREEN IS 100% OPEN!
                      WindowManager.LayoutParams params = new WindowManager.LayoutParams(
                          WindowManager.LayoutParams.WRAP_CONTENT,
                          WindowManager.LayoutParams.WRAP_CONTENT,
                          WindowManager.LayoutParams.TYPE_ACCESSIBILITY_OVERLAY,
                          WindowManager.LayoutParams.FLAG_NOT_FOCUSABLE | WindowManager.LayoutParams.FLAG_LAYOUT_IN_SCREEN,
                          PixelFormat.TRANSLUCENT
                      );
                      params.gravity = Gravity.BOTTOM | Gravity.CENTER_HORIZONTAL;
                      params.y = dp(24);

                      try {
                          windowManager.addView(pillContainer, params);
                          isAttached = true;
                      } catch (Exception ignored) {}
                  });
              }

              public void hide() {
                  mainHandler.post(() -> {
                      if (!isAttached) return;
                      try {
                          windowManager.removeView(pillContainer);
                          isAttached = false;
                      } catch (Exception ignored) {}
                  });
              }

              public void updateState(State state, String title, String sub) {
                  mainHandler.post(() -> {
                      statusText.setText(title);
                      subText.setText(sub);
                      switch (state) {
                          case LISTENING:
                              setOrbColor(Color.parseColor("#A855F7")); // Purple
                              actionBtn.setText("End");
                              break;
                          case WORKING:
                              setOrbColor(Color.parseColor("#06B6D4")); // Cyan
                              actionBtn.setText("...");
                              break;
                          case SPEAKING:
                              setOrbColor(Color.parseColor("#F59E0B")); // Amber
                              actionBtn.setText("End");
                              break;
                          case IDLE:
                          default:
                              setOrbColor(Color.parseColor("#4338CA")); // Blue
                              actionBtn.setText("Start");
                              break;
                      }
                  });
              }

              private int dp(int val) {
                  float density = context.getResources().getDisplayMetrics().density;
                  return Math.round(val * density);
              }
          }
