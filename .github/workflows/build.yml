name: Build Pure Native Voice APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Accept Android SDK Licenses
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true

      - name: Scaffold Pure Native Android Architecture
        run: |
          mkdir -p app/src/main/java/com/gemini/live
          mkdir -p app/src/main/res/xml
          mkdir -p app/src/main/res/values
          mkdir -p app/src/main/res/mipmap-xxxhdpi
          mkdir -p app/src/main/res/mipmap-xxhdpi
          mkdir -p app/src/main/res/mipmap-xhdpi
          mkdir -p app/src/main/res/mipmap-hdpi
          mkdir -p app/src/main/res/mipmap-mdpi

          # Fallback icon
          echo "iVBORw0KGgoAAAANSUhEUgAAAEAAAABACAYAAACqaXHeAAAATUlEQVR42u3PMQEAAAgEIPuX1hgc/LDBV9JJ6rWTAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAwBv0hQABH1mYugAAAABJRU5ErkJggg==" | base64 -d > app/src/main/res/mipmap-hdpi/ic_launcher.png
          cp app/src/main/res/mipmap-hdpi/ic_launcher.png app/src/main/res/mipmap-mdpi/ic_launcher.png
          cp app/src/main/res/mipmap-hdpi/ic_launcher.png app/src/main/res/mipmap-xhdpi/ic_launcher.png
          cp app/src/main/res/mipmap-hdpi/ic_launcher.png app/src/main/res/mipmap-xxhdpi/ic_launcher.png
          cp app/src/main/res/mipmap-hdpi/ic_launcher.png app/src/main/res/mipmap-xxxhdpi/ic_launcher.png

          if [ -f icon.png ]; then
            cp icon.png app/src/main/res/mipmap-xxxhdpi/ic_launcher.png
            cp icon.png app/src/main/res/mipmap-xxhdpi/ic_launcher.png
            cp icon.png app/src/main/res/mipmap-xhdpi/ic_launcher.png
            cp icon.png app/src/main/res/mipmap-hdpi/ic_launcher.png
            cp icon.png app/src/main/res/mipmap-mdpi/ic_launcher.png
          fi

          cat << 'EOF' > app/src/main/res/values/strings.xml
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <string name="app_name">Voice Native</string>
              <string name="accessibility_desc">Hardware accelerated autonomous Gemini assistant with double-click volume trigger and physical touch engine.</string>
          </resources>
          EOF

          cat << 'EOF' > app/src/main/res/values/styles.xml
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <style name="Theme.VoiceNative" parent="Theme.AppCompat.DayNight.NoActionBar">
                  <item name="android:windowBackground">#121420</item>
                  <item name="android:statusBarColor">#0D101A</item>
                  <item name="colorPrimary">#7C3AED</item>
              </style>
          </resources>
          EOF

          cat << 'EOF' > app/src/main/res/xml/accessibility_service_config.xml
          <?xml version="1.0" encoding="utf-8"?>
          <accessibility-service xmlns:android="http://schemas.android.com/apk/res/android"
              android:accessibilityEventTypes="typeWindowStateChanged|typeWindowContentChanged"
              android:accessibilityFeedbackType="feedbackGeneric"
              android:accessibilityFlags="flagDefault|flagRequestFilterKeyEvents|flagRetrieveInteractiveWindows"
              android:canRequestFilterKeyEvents="true"
              android:canRetrieveWindowContent="true"
              android:canPerformGestures="true"
              android:description="@string/accessibility_desc"
              android:notificationTimeout="50" />
          EOF

          cat << 'EOF' > gradle.properties
          android.useAndroidX=true
          android.nonTransitiveRClass=true
          org.gradle.jvmargs=-Xmx2048m
          EOF

          cat << 'EOF' > build.gradle
          buildscript {
              repositories {
                  google()
                  mavenCentral()
              }
              dependencies {
                  classpath 'com.android.tools.build:gradle:8.2.2'
              }
          }
          allprojects {
              repositories {
                  google()
                  mavenCentral()
              }
          }
          EOF

          cat << 'EOF' > settings.gradle
          rootProject.name = "VoiceNative"
          include ':app'
          EOF

          cat << 'EOF' > app/build.gradle
          apply plugin: 'com.android.application'

          android {
              namespace 'com.gemini.live'
              compileSdk 34

              defaultConfig {
                  applicationId "com.gemini.live"
                  minSdk 24
                  targetSdk 34
                  versionCode 14
                  versionName "3.0"
              }
              buildTypes {
                  release {
                      minifyEnabled false
                  }
              }
          }

          dependencies {
              implementation 'androidx.appcompat:appcompat:1.6.1'
              implementation 'com.google.android.material:material:1.11.0'
              implementation 'com.squareup.okhttp3:okhttp:4.12.0'
          }
          EOF

          cat << 'EOF' > app/src/main/AndroidManifest.xml
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.INTERNET" />
              <uses-permission android:name="android.permission.RECORD_AUDIO" />
              <uses-permission android:name="android.permission.MODIFY_AUDIO_SETTINGS" />
              <uses-permission android:name="android.permission.CAMERA" />
              <uses-permission android:name="android.permission.FLASHLIGHT" />
              <uses-permission android:name="android.permission.VIBRATE" />
              <uses-permission android:name="android.permission.CALL_PHONE" />
              <uses-permission android:name="android.permission.SEND_SMS" />
              <uses-permission android:name="android.permission.READ_CONTACTS" />
              <uses-permission android:name="android.permission.READ_CALL_LOG" />
              <uses-permission android:name="android.permission.SYSTEM_ALERT_WINDOW" />
              <uses-permission android:name="android.permission.FOREGROUND_SERVICE" />
              <uses-permission android:name="android.permission.FOREGROUND_SERVICE_MEDIA_PROJECTION" />

              <application
                  android:label="Voice Native"
                  android:icon="@mipmap/ic_launcher"
                  android:hardwareAccelerated="true"
                  android:theme="@style/Theme.VoiceNative">

                  <activity
                      android:name=".SettingsActivity"
                      android:exported="true"
                      android:theme="@style/Theme.VoiceNative">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>

                  <service
                      android:name=".VolumeTriggerService"
                      android:permission="android.permission.BIND_ACCESSIBILITY_SERVICE"
                      android:exported="true">
                      <intent-filter>
                          <action android:name="android.accessibilityservice.AccessibilityService" />
                      </intent-filter>
                      <meta-data
                          android:name="android.accessibilityservice"
                          android:resource="@xml/accessibility_service_config" />
                  </service>

                  <service
                      android:name=".ScreenCaptureService"
                      android:enabled="true"
                      android:exported="false"
                      android:foregroundServiceType="mediaProjection" />
              </application>
          </manifest>
          EOF

          # ScreenCaptureService.java: 1:1 288x592 On-Demand Capture
          cat << 'EOF' > app/src/main/java/com/gemini/live/ScreenCaptureService.java
          package com.gemini.live;

          import android.app.Notification;
          import android.app.NotificationChannel;
          import android.app.NotificationManager;
          import android.app.Service;
          import android.content.Context;
          import android.content.Intent;
          import android.content.pm.ServiceInfo;
          import android.graphics.Bitmap;
          import android.graphics.PixelFormat;
          import android.hardware.display.DisplayManager;
          import android.hardware.display.VirtualDisplay;
          import android.media.Image;
          import android.media.ImageReader;
          import android.media.projection.MediaProjection;
          import android.media.projection.MediaProjectionManager;
          import android.os.Build;
          import android.os.IBinder;
          import android.os.SystemClock;
          import android.util.Base64;
          import android.util.DisplayMetrics;
          import android.view.WindowManager;
          import java.io.ByteArrayOutputStream;
          import java.nio.ByteBuffer;

          public class ScreenCaptureService extends Service {
              public static ScreenCaptureService instance = null;
              private MediaProjection mediaProjection;
              private int resultCode = 0;
              private Intent resultData = null;

              @Override
              public void onCreate() {
                  super.onCreate();
                  instance = this;
                  startForegroundNotification();
              }

              @Override
              public int onStartCommand(Intent intent, int flags, int startId) {
                  startForegroundNotification();
                  if (intent != null && intent.hasExtra("resultCode") && intent.hasExtra("data")) {
                      this.resultCode = intent.getIntExtra("resultCode", 0);
                      this.resultData = intent.getParcelableExtra("data");
                      initProjection();
                  }
                  return START_STICKY;
              }

              private void initProjection() {
                  try {
                      if (mediaProjection == null && resultData != null) {
                          MediaProjectionManager mpm = (MediaProjectionManager) getSystemService(Context.MEDIA_PROJECTION_SERVICE);
                          if (mpm != null) {
                              mediaProjection = mpm.getMediaProjection(resultCode, resultData);
                          }
                      }
                  } catch (Exception ignored) {}
              }

              // 1:1 Crisp Capture for J6+ (288x592) with instant VirtualDisplay teardown
              public String captureScreenBase64() {
                  if (mediaProjection == null) {
                      initProjection();
                      if (mediaProjection == null) return null;
                  }

                  VirtualDisplay virtualDisplay = null;
                  ImageReader imageReader = null;
                  Image image = null;
                  Bitmap bitmap = null;

                  try {
                      WindowManager wm = (WindowManager) getSystemService(Context.WINDOW_SERVICE);
                      DisplayMetrics dm = new DisplayMetrics();
                      if (wm != null) wm.getDefaultDisplay().getRealMetrics(dm);
                      else dm = getResources().getDisplayMetrics();

                      int width = dm.widthPixels;
                      int height = dm.heightPixels;

                      imageReader = ImageReader.newInstance(width, height, PixelFormat.RGBA_8888, 2);
                      virtualDisplay = mediaProjection.createVirtualDisplay(
                          "VoiceShot", width, height, dm.densityDpi,
                          DisplayManager.VIRTUAL_DISPLAY_FLAG_AUTO_MIRROR,
                          imageReader.getSurface(), null, null
                      );

                      for (int i = 0; i < 6; i++) {
                          SystemClock.sleep(50);
                          image = imageReader.acquireLatestImage();
                          if (image != null) break;
                      }

                      if (image == null) return null;

                      Image.Plane[] planes = image.getPlanes();
                      ByteBuffer buffer = planes[0].getBuffer();
                      int pixelStride = planes[0].getPixelStride();
                      int rowStride = planes[0].getRowStride();
                      int rowPadding = rowStride - pixelStride * width;

                      bitmap = Bitmap.createBitmap(width + rowPadding / pixelStride, height, Bitmap.Config.ARGB_8888);
                      bitmap.copyPixelsFromBuffer(buffer);

                      Bitmap cropped = Bitmap.createBitmap(bitmap, 0, 0, width, height);
                      ByteArrayOutputStream baos = new ByteArrayOutputStream();
                      cropped.compress(Bitmap.CompressFormat.JPEG, 65, baos);
                      return Base64.encodeToString(baos.toByteArray(), Base64.NO_WRAP);

                  } catch (Exception e) {
                      return null;
                  } finally {
                      if (bitmap != null) bitmap.recycle();
                      if (image != null) image.close();
                      if (virtualDisplay != null) virtualDisplay.release();
                      if (imageReader != null) imageReader.close();
                  }
              }

              private void startForegroundNotification() {
                  String channelId = "voice_screen_capture";
                  NotificationManager nm = (NotificationManager) getSystemService(Context.NOTIFICATION_SERVICE);
                  if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.O && nm != null) {
                      NotificationChannel chan = new NotificationChannel(channelId, "Voice Native Engine", NotificationManager.IMPORTANCE_LOW);
                      nm.createNotificationChannel(chan);
                  }

                  Notification.Builder b = (Build.VERSION.SDK_INT >= Build.VERSION_CODES.O) 
                      ? new Notification.Builder(this, channelId) 
                      : new Notification.Builder(this);

                  Notification notif = b.setContentTitle("Voice Native")
                      .setContentText("Autonomous engine active")
                      .setSmallIcon(android.R.drawable.ic_menu_camera)
                      .build();

                  if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.Q) {
                      startForeground(1001, notif, ServiceInfo.FOREGROUND_SERVICE_TYPE_MEDIA_PROJECTION);
                  } else {
                      startForeground(1001, notif);
                  }
              }

              @Override
              public void onDestroy() {
                  instance = null;
                  if (mediaProjection != null) mediaProjection.stop();
                  super.onDestroy();
              }

              @Override
              public IBinder onBind(Intent intent) { return null; }
          }
          EOF

          # AudioEngine.java: Direct Hardware 16kHz Record & 24kHz Track
          cat << 'EOF' > app/src/main/java/com/gemini/live/AudioEngine.java
          package com.gemini.live;

          import android.media.AudioFormat;
          import android.media.AudioManager;
          import android.media.AudioRecord;
          import android.media.AudioTrack;
          import android.media.MediaRecorder;
          import android.util.Base64;

          public class AudioEngine {
              public interface AudioChunkListener {
                  void onAudioChunk(String base64Pcm);
                  void onUserSpeakingDetected();
              }

              private AudioRecord audioRecord;
              private AudioTrack audioTrack;
              private Thread recordThread;
              private boolean isRecording = false;
              private boolean isMuted = false;
              private boolean isModelSpeaking = false;
              private AudioChunkListener listener;

              public AudioEngine(AudioChunkListener listener) {
                  this.listener = listener;
                  initAudioTrack();
              }

              private void initAudioTrack() {
                  int minBuf = AudioTrack.getMinBufferSize(24000, AudioFormat.CHANNEL_OUT_MONO, AudioFormat.ENCODING_PCM_16BIT);
                  audioTrack = new AudioTrack(AudioManager.STREAM_MUSIC, 24000, 
                      AudioFormat.CHANNEL_OUT_MONO, AudioFormat.ENCODING_PCM_16BIT, 
                      Math.max(minBuf, 4096), AudioTrack.MODE_STREAM);
                  audioTrack.play();
              }

              public void startRecording() {
                  if (isRecording) return;
                  int minBuf = AudioRecord.getMinBufferSize(16000, AudioFormat.CHANNEL_IN_MONO, AudioFormat.ENCODING_PCM_16BIT);
                  try {
                      audioRecord = new AudioRecord(MediaRecorder.AudioSource.MIC, 16000, 
                          AudioFormat.CHANNEL_IN_MONO, AudioFormat.ENCODING_PCM_16BIT, 
                          Math.max(minBuf, 2048));
                      audioRecord.startRecording();
                      isRecording = true;

                      recordThread = new Thread(() -> {
                          byte[] buffer = new byte[1024];
                          while (isRecording) {
                              int read = audioRecord.read(buffer, 0, buffer.length);
                              if (read > 0 && !isMuted && !isModelSpeaking) {
                                  // Voice activity detection
                                  long sum = 0;
                                  for (int i = 0; i < read; i += 2) {
                                      short val = (short) ((buffer[i + 1] << 8) | (buffer[i] & 0xFF));
                                      sum += val * val;
                                  }
                                  double rms = Math.sqrt(sum / (read / 2.0));
                                  if (rms > 600 && listener != null) {
                                      listener.onUserSpeakingDetected();
                                  }

                                  String b64 = Base64.encodeToString(buffer, 0, read, Base64.NO_WRAP);
                                  if (listener != null) listener.onAudioChunk(b64);
                              }
                          }
                      });
                      recordThread.setPriority(Thread.MAX_PRIORITY);
                      recordThread.start();
                  } catch (Exception ignored) {}
              }

              public void stopRecording() {
                  isRecording = false;
                  if (recordThread != null) {
                      recordThread.interrupt();
                      recordThread = null;
                  }
                  if (audioRecord != null) {
                      try { audioRecord.stop(); audioRecord.release(); } catch (Exception ignored) {}
                      audioRecord = null;
                  }
              }

              public void playPcmChunk(byte[] pcmBytes) {
                  if (audioTrack != null && pcmBytes != null && pcmBytes.length > 0) {
                      isModelSpeaking = true;
                      audioTrack.write(pcmBytes, 0, pcmBytes.length);
                  }
              }

              public void stopPlayback() {
                  if (audioTrack != null) {
                      try {
                          audioTrack.pause();
                          audioTrack.flush();
                          audioTrack.play();
                      } catch (Exception ignored) {}
                  }
                  isModelSpeaking = false;
              }

              public void setModelSpeaking(boolean speaking) { this.isModelSpeaking = speaking; }
              public boolean isModelSpeaking() { return isModelSpeaking; }
              public void setMuted(boolean muted) { this.isMuted = muted; }
              public boolean isMuted() { return isMuted; }

              public void release() {
                  stopRecording();
                  if (audioTrack != null) {
                      try { audioTrack.stop(); audioTrack.release(); } catch (Exception ignored) {}
                      audioTrack = null;
                  }
              }
          }
          EOF

          # GeminiLiveClient.java: Native OkHttp WebSocket Engine
          cat << 'EOF' > app/src/main/java/com/gemini/live/GeminiLiveClient.java
          package com.gemini.live;

          import android.os.Handler;
          import android.os.Looper;
          import android.util.Base64;
          import okhttp3.OkHttpClient;
          import okhttp3.Request;
          import okhttp3.Response;
          import okhttp3.WebSocket;
          import okhttp3.WebSocketListener;
          import org.json.JSONArray;
          import org.json.JSONObject;
          import java.util.concurrent.TimeUnit;

          public class GeminiLiveClient {
              public interface LiveCallback {
                  void onConnected();
                  void onModelSpeaking();
                  void onTurnComplete();
                  void onToolCall(String name, JSONObject args, String callId);
                  void onClosed();
              }

              private WebSocket webSocket;
              private OkHttpClient client;
              private LiveCallback callback;
              private Handler mainHandler = new Handler(Looper.getMainLooper());

              public GeminiLiveClient(LiveCallback callback) {
                  this.callback = callback;
                  this.client = new OkHttpClient.Builder()
                      .pingInterval(15, TimeUnit.SECONDS)
                      .readTimeout(0, TimeUnit.MILLISECONDS)
                      .build();
              }

              public void connect(String apiKey, String model, String voice, String prompt) {
                  String url = "wss://generativelanguage.googleapis.com/ws/google.ai.generativelanguage.v1beta.GenerativeService.BidiGenerateContent?key=" + apiKey.trim();
                  Request request = new Request.Builder().url(url).build();

                  webSocket = client.newWebSocket(request, new WebSocketListener() {
                      @Override
                      public void onOpen(WebSocket ws, Response response) {
                          sendSetup(ws, model, voice, prompt);
                          mainHandler.post(() -> { if (callback != null) callback.onConnected(); });
                      }

                      @Override
                      public void onMessage(WebSocket ws, String text) {
                          handleIncomingJson(text);
                      }

                      @Override
                      public void onClosed(WebSocket ws, int code, String reason) {
                          mainHandler.post(() -> { if (callback != null) callback.onClosed(); });
                      }

                      @Override
                      public void onFailure(WebSocket ws, Throwable t, Response response) {
                          mainHandler.post(() -> { if (callback != null) callback.onClosed(); });
                      }
                  });
              }

              private void sendSetup(WebSocket ws, String model, String voice, String prompt) {
                  try {
                      JSONObject setup = new JSONObject();
                      setup.put("model", model.trim());

                      JSONObject genConfig = new JSONObject();
                      JSONArray modalities = new JSONArray();
                      modalities.put("AUDIO");
                      genConfig.put("responseModalities", modalities);

                      JSONObject speechConfig = new JSONObject();
                      JSONObject voiceConfig = new JSONObject();
                      JSONObject prebuilt = new JSONObject();
                      prebuilt.put("voiceName", voice);
                      voiceConfig.put("prebuiltVoiceConfig", prebuilt);
                      speechConfig.put("voiceConfig", voiceConfig);
                      genConfig.put("speechConfig", speechConfig);
                      setup.put("generationConfig", genConfig);

                      if (prompt != null && !prompt.trim().isEmpty()) {
                          JSONObject sysInst = new JSONObject();
                          JSONArray parts = new JSONArray();
                          parts.put(new JSONObject().put("text", prompt.trim()));
                          sysInst.put("parts", parts);
                          setup.put("systemInstruction", sysInst);
                      }

                      setup.put("tools", getDeviceToolDeclarations());
                      ws.send(new JSONObject().put("setup", setup).toString());
                  } catch (Exception ignored) {}
              }

              private JSONArray getDeviceToolDeclarations() throws Exception {
                  JSONArray tools = new JSONArray();
                  JSONObject toolObj = new JSONObject();
                  JSONArray declarations = new JSONArray();

                  declarations.put(makeDecl("create_note", "Instant zero-failure note creation via Android intent", "text", "The note content"));
                  declarations.put(makeDecl("type_text", "Insert text into the active field or open note", "text", "The text to write"));
                  declarations.put(makeCoordDecl("tap_coordinates", "Physically tap screen. Normalized 0 to 1000 coordinates (x=500,y=500 is center)"));
                  declarations.put(makeCoordDecl("long_press", "Long press screen for 700ms at normalized 0 to 1000 coordinates"));
                  declarations.put(makeDecl("tap_element", "Click UI element matching a label or description", "label", "Label of the button"));
                  declarations.put(makeSimpleDecl("scroll", "Scroll screen up or down", "direction", "down or up"));
                  declarations.put(makeSimpleDecl("read_screen_text", "Read visible screen text and interactive elements catalog", null, null));
                  declarations.put(makeSimpleDecl("capture_screen", "Capture crisp 1:1 screenshot to visually analyze buttons", null, null));
                  declarations.put(makeSimpleDecl("open_application", "Launch an installed app by name", "app_name", "Name of the app"));
                  declarations.put(makeSimpleDecl("search_contacts", "Search contact phone number by name", "query", "Contact name"));
                  declarations.put(makeSimpleDecl("search_youtube", "Open YouTube searching for video", "query", "Search term"));
                  declarations.put(makeSimpleDecl("search_web", "Open Google search in browser", "query", "Search term"));
                  declarations.put(makeSimpleDecl("open_whatsapp", "Open WhatsApp chat", "phone_number", "Phone number"));
                  declarations.put(makeSimpleDecl("make_phone_call", "Call a phone number", "phone_number", "Phone number"));
                  declarations.put(makeSimpleDecl("toggle_flashlight", "Turn flashlight on or off", "state", "true or false"));

                  toolObj.put("functionDeclarations", declarations);
                  tools.put(toolObj);
                  return tools;
              }

              private JSONObject makeDecl(String name, String desc, String param, String paramDesc) throws Exception {
                  JSONObject decl = new JSONObject();
                  decl.put("name", name);
                  decl.put("description", desc);
                  JSONObject params = new JSONObject();
                  params.put("type", "OBJECT");
                  JSONObject props = new JSONObject();
                  props.put(param, new JSONObject().put("type", "STRING").put("description", paramDesc));
                  params.put("properties", props);
                  params.put("required", new JSONArray().put(param));
                  decl.put("parameters", params);
                  return decl;
              }

              private JSONObject makeSimpleDecl(String name, String desc, String param, String paramDesc) throws Exception {
                  JSONObject decl = new JSONObject();
                  decl.put("name", name);
                  decl.put("description", desc);
                  JSONObject params = new JSONObject();
                  params.put("type", "OBJECT");
                  JSONObject props = new JSONObject();
                  if (param != null) {
                      props.put(param, new JSONObject().put("type", "STRING").put("description", paramDesc));
                      params.put("required", new JSONArray().put(param));
                  }
                  params.put("properties", props);
                  decl.put("parameters", params);
                  return decl;
              }

              private JSONObject makeCoordDecl(String name, String desc) throws Exception {
                  JSONObject decl = new JSONObject();
                  decl.put("name", name);
                  decl.put("description", desc);
                  JSONObject params = new JSONObject();
                  params.put("type", "OBJECT");
                  JSONObject props = new JSONObject();
                  props.put("x", new JSONObject().put("type", "INTEGER").put("description", "X coordinate 0 to 1000"));
                  props.put("y", new JSONObject().put("type", "INTEGER").put("description", "Y coordinate 0 to 1000"));
                  params.put("properties", props);
                  JSONArray req = new JSONArray();
                  req.put("x"); req.put("y");
                  params.put("required", req);
                  decl.put("parameters", params);
                  return decl;
              }

              public void sendAudioChunk(String base64Pcm) {
                  if (webSocket == null) return;
                  try {
                      JSONObject real = new JSONObject();
                      JSONObject audio = new JSONObject();
                      audio.put("data", base64Pcm);
                      audio.put("mimeType", "audio/pcm;rate=16000");
                      real.put("audio", audio);
                      webSocket.send(new JSONObject().put("realtimeInput", real).toString());
                  } catch (Exception ignored) {}
              }

              public void sendImageFrame(String base64Jpeg) {
                  if (webSocket == null) return;
                  try {
                      JSONObject real = new JSONObject();
                      JSONObject video = new JSONObject();
                      video.put("data", base64Jpeg);
                      video.put("mimeType", "image/jpeg");
                      real.put("video", video);
                      webSocket.send(new JSONObject().put("realtimeInput", real).toString());
                  } catch (Exception ignored) {}
              }

              public void sendToolResponse(String callId, String result) {
                  if (webSocket == null) return;
                  try {
                      JSONObject toolResp = new JSONObject();
                      JSONArray funcResponses = new JSONArray();
                      JSONObject respObj = new JSONObject();
                      respObj.put("id", callId);
                      respObj.put("response", new JSONObject().put("output", new JSONObject().put("result", result)));
                      funcResponses.put(respObj);
                      toolResp.put("functionResponses", funcResponses);
                      webSocket.send(new JSONObject().put("toolResponse", toolResp).toString());
                  } catch (Exception ignored) {}
              }

              private void handleIncomingJson(String jsonStr) {
                  try {
                      JSONObject res = new JSONObject(jsonStr);

                      if (res.has("toolCall")) {
                          JSONObject toolCall = res.getJSONObject("toolCall");
                          JSONArray calls = toolCall.optJSONArray("functionCalls");
                          if (calls != null) {
                              for (int i = 0; i < calls.length(); i++) {
                                  JSONObject c = calls.getJSONObject(i);
                                  String name = c.getString("name");
                                  JSONObject args = c.optJSONObject("args");
                                  String id = c.optString("id", "call_1");
                                  mainHandler.post(() -> {
                                      if (callback != null) callback.onToolCall(name, args, id);
                                  });
                              }
                          }
                      }

                      if (res.has("serverContent")) {
                          JSONObject sc = res.getJSONObject("serverContent");
                          if (sc.optBoolean("interrupted", false)) {
                              mainHandler.post(() -> {
                                  if (VolumeTriggerService.instance != null) {
                                      VolumeTriggerService.instance.getAudioEngine().stopPlayback();
                                  }
                              });
                          }

                          JSONObject modelTurn = sc.optJSONObject("modelTurn");
                          if (modelTurn != null) {
                              JSONArray parts = modelTurn.optJSONArray("parts");
                              if (parts != null) {
                                  for (int i = 0; i < parts.length(); i++) {
                                      JSONObject p = parts.getJSONObject(i);
                                      JSONObject inline = p.optJSONObject("inlineData");
                                      String b64 = inline != null ? inline.optString("data") : p.optString("data");
                                      if (b64 != null && !b64.isEmpty()) {
                                          byte[] pcm = Base64.decode(b64, Base64.NO_WRAP);
                                          if (VolumeTriggerService.instance != null) {
                                              VolumeTriggerService.instance.getAudioEngine().playPcmChunk(pcm);
                                              mainHandler.post(() -> { if (callback != null) callback.onModelSpeaking(); });
                                          }
                                      }
                                  }
                              }
                          }

                          if (sc.optBoolean("turnComplete", false)) {
                              mainHandler.post(() -> { if (callback != null) callback.onTurnComplete(); });
                          }
                      }
                  } catch (Exception ignored) {}
              }

              public void disconnect() {
                  if (webSocket != null) {
                      webSocket.close(1000, "Clean close");
                      webSocket = null;
                  }
              }
          }
