      - name: Generate Gradle Wrapper
        run: gradle wrapper --gradle-version 8.5

      - name: Compile Pure Native Debug APK
        run: ./gradlew assembleDebug

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Voice-Native-APK
          path: app/build/outputs/apk/debug/app-debug.apk

      - name: Release Voice Native v3.0
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release delete v3.0 --yes || true
          git tag -d v3.0 || true
          gh release create v3.0 app/build/outputs/apk/debug/app-debug.apk \
            --title "Voice Native v3.0 (Fixed Ping & Handshake)" \
            --notes "Voice Native v3.0: Fixed WebSocket ping timeout, gated audio streaming on setupComplete, and integrated Material Design UI." || true
