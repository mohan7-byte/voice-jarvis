name: Build Pure Native Voice APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Accept Android SDK Licenses
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true

      - name: Scaffold Pure Native Android Architecture
        run: |
          mkdir -p app/src/main/java/com/gemini/live
          mkdir -p app/src/main/res/xml
          mkdir -p app/src/main/res/values
          mkdir -p app/src/main/res/drawable
          mkdir -p app/src/main/res/layout
          mkdir -p app/src/main/res/mipmap-xxxhdpi
          mkdir -p app/src/main/res/mipmap-xxhdpi
          mkdir -p app/src/main/res/mipmap-xhdpi
          mkdir -p app/src/main/res/mipmap-hdpi
          mkdir -p app/src/main/res/mipmap-mdpi

          # Fallback icon
          echo "iVBORw0KGgoAAAANSUhEUgAAAEAAAABACAYAAACqaXHeAAAATUlEQVR42u3PMQEAAAgEIPuX1hgc/LDBV9JJ6rWTAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAwBv0hQABH1mYugAAAABJRU5ErkJggg==" | base64 -d > app/src/main/res/mipmap-hdpi/ic_launcher.png
          cp app/src/main/res/mipmap-hdpi/ic_launcher.png app/src/main/res/mipmap-mdpi/ic_launcher.png
          cp app/src/main/res/mipmap-hdpi/ic_launcher.png app/src/main/res/mipmap-xhdpi/ic_launcher.png
          cp app/src/main/res/mipmap-hdpi/ic_launcher.png app/src/main/res/mipmap-xxhdpi/ic_launcher.png
          cp app/src/main/res/mipmap-hdpi/ic_launcher.png app/src/main/res/mipmap-xxxhdpi/ic_launcher.png

          if [ -f icon.png ]; then
            cp icon.png app/src/main/res/mipmap-xxxhdpi/ic_launcher.png
            cp icon.png app/src/main/res/mipmap-xxhdpi/ic_launcher.png
            cp icon.png app/src/main/res/mipmap-xhdpi/ic_launcher.png
            cp icon.png app/src/main/res/mipmap-hdpi/ic_launcher.png
            cp icon.png app/src/main/res/mipmap-mdpi/ic_launcher.png
          fi

          cat << 'EOF' > app/src/main/res/values/strings.xml
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <string name="app_name">Voice Native</string>
              <string name="accessibility_desc">Hardware accelerated autonomous Gemini assistant with double-click volume trigger and physical touch engine.</string>
          </resources>
          EOF

          cat << 'EOF' > app/src/main/res/xml/accessibility_service_config.xml
          <?xml version="1.0" encoding="utf-8"?>
          <accessibility-service xmlns:android="http://schemas.android.com/apk/res/android"
              android:accessibilityEventTypes="typeWindowStateChanged|typeWindowContentChanged"
              android:accessibilityFeedbackType="feedbackGeneric"
              android:accessibilityFlags="flagDefault|flagRequestFilterKeyEvents|flagRetrieveInteractiveWindows"
              android:canRequestFilterKeyEvents="true"
              android:canRetrieveWindowContent="true"
              android:canPerformGestures="true"
              android:description="@string/accessibility_desc"
              android:notificationTimeout="50" />
          EOF

          cat << 'EOF' > app/src/main/res/values/colors.xml
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <color name="oled_background">#0D101A</color>
              <color name="oled_surface">#121420</color>
              <color name="oled_surface_alt">#171A27</color>
              <color name="purple_accent">#7C3AED</color>
              <color name="purple_accent_dark">#5B21B6</color>
              <color name="purple_accent_soft">#241642</color>
              <color name="white_primary">#F8F8FC</color>
              <color name="white_secondary">#A7A9B7</color>
              <color name="white_tertiary">#777B8D</color>
              <color name="border_white_15">#26FFFFFF</color>
              <color name="border_white_10">#1AFFFFFF</color>
              <color name="input_black">#000000</color>
              <color name="switch_off_track">#303444</color>
              <color name="switch_off_thumb">#D7D9E2</color>
              <color name="dropdown_background">#171A27</color>
              <color name="dropdown_selected">#241642</color>
          </resources>
          EOF

          cat << 'EOF' > app/src/main/res/values/styles.xml
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <style name="AppTheme" parent="Theme.MaterialComponents.DayNight.NoActionBar">
                  <item name="android:fontFamily">sans-serif</item>
                  <item name="android:windowLightStatusBar">false</item>
                  <item name="android:statusBarColor">@color/oled_background</item>
                  <item name="android:navigationBarColor">@color/oled_background</item>
                  <item name="android:windowLightNavigationBar">false</item>
                  <item name="android:windowBackground">@color/oled_background</item>
                  <item name="android:colorAccent">@color/purple_accent</item>
                  <item name="colorPrimary">@color/purple_accent</item>
                  <item name="colorPrimaryVariant">@color/purple_accent_dark</item>
                  <item name="colorSecondary">@color/purple_accent</item>
              </style>

              <style name="SettingsSectionLabel" parent="TextAppearance.MaterialComponents.Caption">
                  <item name="android:textSize">10sp</item>
                  <item name="android:letterSpacing">0.08</item>
                  <item name="android:textColor">@color/white_secondary</item>
                  <item name="android:textStyle">bold</item>
              </style>

              <style name="SettingsRowTitle" parent="TextAppearance.MaterialComponents.Body1">
                  <item name="android:textSize">14sp</item>
                  <item name="android:textColor">@color/white_primary</item>
              </style>

              <style name="SettingsRowSubtitle" parent="TextAppearance.MaterialComponents.Caption">
                  <item name="android:textSize">10sp</item>
                  <item name="android:textColor">@color/white_tertiary</item>
              </style>

              <style name="SettingsInputText" parent="TextAppearance.MaterialComponents.Body1">
                  <item name="android:textSize">13sp</item>
                  <item name="android:textColor">@color/white_primary</item>
                  <item name="android:textColorHint">@color/white_secondary</item>
              </style>
          </resources>
          EOF

          cat << 'EOF' > app/src/main/res/drawable/bg_purple_card.xml
          <?xml version="1.0" encoding="utf-8"?>
          <shape xmlns:android="http://schemas.android.com/apk/res/android"
              android:shape="rectangle">
              <solid android:color="#241642" />
              <stroke
                  android:width="1dp"
                  android:color="#387C3AED" />
              <corners android:radius="14dp" />
              <padding
                  android:left="14dp"
                  android:top="11dp"
                  android:right="12dp"
                  android:bottom="11dp" />
          </shape>
          EOF

          cat << 'EOF' > app/src/main/res/drawable/bg_input_field.xml
          <?xml version="1.0" encoding="utf-8"?>
          <shape xmlns:android="http://schemas.android.com/apk/res/android"
              android:shape="rectangle">
              <solid android:color="#000000" />
              <stroke
                  android:width="1dp"
                  android:color="#26FFFFFF" />
              <corners android:radius="11dp" />
              <padding
                  android:left="12dp"
                  android:top="10dp"
                  android:right="12dp"
                  android:bottom="10dp" />
          </shape>
          EOF

          cat << 'EOF' > app/src/main/res/layout/activity_settings.xml
          <?xml version="1.0" encoding="utf-8"?>
          <androidx.core.widget.NestedScrollView
              xmlns:android="http://schemas.android.com/apk/res/android"
              xmlns:app="http://schemas.android.com/apk/res-auto"
              android:id="@+id/rootScroll"
              android:layout_width="match_parent"
              android:layout_height="match_parent"
              android:fillViewport="true"
              android:background="@color/oled_background"
              android:clipToPadding="false"
              android:paddingTop="8dp"
              android:paddingBottom="18dp">

              <LinearLayout
                  android:id="@+id/contentContainer"
                  android:layout_width="match_parent"
                  android:layout_height="wrap_content"
                  android:orientation="vertical"
                  android:paddingStart="15dp"
                  android:paddingEnd="15dp">

                  <com.google.android.material.card.MaterialCardView
                      android:id="@+id/volumeSetupCard"
                      android:layout_width="match_parent"
                      android:layout_height="wrap_content"
                      android:layout_marginTop="4dp"
                      android:layout_marginBottom="16dp"
                      android:clickable="true"
                      android:focusable="true"
                      android:foreground="?attr/selectableItemBackground"
                      app:cardBackgroundColor="@android:color/transparent"
                      app:cardCornerRadius="14dp"
                      app:cardElevation="0dp"
                      app:strokeWidth="0dp">

                      <LinearLayout
                          android:layout_width="match_parent"
                          android:layout_height="wrap_content"
                          android:background="@drawable/bg_purple_card"
                          android:gravity="center_vertical"
                          android:minHeight="70dp"
                          android:orientation="horizontal">

                          <TextView
                              android:id="@+id/volumeIcon"
                              android:layout_width="30dp"
                              android:layout_height="30dp"
                              android:gravity="center"
                              android:text="⚡"
                              android:textColor="@color/white_primary"
                              android:textSize="19sp" />

                          <LinearLayout
                              android:layout_width="0dp"
                              android:layout_height="wrap_content"
                              android:layout_weight="1"
                              android:orientation="vertical"
                              android:paddingStart="5dp"
                              android:paddingEnd="8dp">

                              <TextView
                                  android:id="@+id/volumeSetupTitle"
                                  android:layout_width="match_parent"
                                  android:layout_height="wrap_content"
                                  android:text="Double-Click Volume Setup"
                                  android:textColor="@color/white_primary"
                                  android:textSize="13sp"
                                  android:textStyle="bold" />

                              <TextView
                                  android:id="@+id/volumeSetupSubtitle"
                                  android:layout_width="match_parent"
                                  android:layout_height="wrap_content"
                                  android:layout_marginTop="3dp"
                                  android:text="Tap to open Accessibility &amp; turn on Voice trigger"
                                  android:textColor="@color/white_secondary"
                                  android:textSize="9sp" />
                          </LinearLayout>

                          <TextView
                              android:id="@+id/volumeArrow"
                              android:layout_width="28dp"
                              android:layout_height="40dp"
                              android:gravity="center"
                              android:text="›"
                              android:textColor="@color/white_primary"
                              android:textSize="27sp" />
                      </LinearLayout>
                  </com.google.android.material.card.MaterialCardView>

                  <TextView
                      android:id="@+id/playbooksLabel"
                      style="@style/SettingsSectionLabel"
                      android:layout_width="match_parent"
                      android:layout_height="wrap_content"
                      android:text="PLAYBOOKS &amp; MEMORY"
                      android:layout_marginBottom="7dp" />

                  <com.google.android.material.card.MaterialCardView
                      android:id="@+id/playbooksCard"
                      android:layout_width="match_parent"
                      android:layout_height="wrap_content"
                      android:layout_marginBottom="15dp"
                      app:cardBackgroundColor="@color/oled_surface"
                      app:cardCornerRadius="13dp"
                      app:cardElevation="0dp"
                      app:strokeColor="@color/border_white_10"
                      app:strokeWidth="1dp">

                      <LinearLayout
                          android:layout_width="match_parent"
                          android:layout_height="wrap_content"
                          android:orientation="vertical"
                          android:padding="11dp">

                          <TextView
                              android:layout_width="match_parent"
                              android:layout_height="wrap_content"
                              android:text="Exact coordinates &amp; self-learned app rules"
                              android:textColor="@color/white_secondary"
                              android:textSize="9sp"
                              android:layout_marginBottom="8dp" />

                          <EditText
                              android:id="@+id/playbooksEditor"
                              android:layout_width="match_parent"
                              android:layout_height="108dp"
                              android:background="@drawable/bg_input_field"
                              android:gravity="top|start"
                              android:inputType="textMultiLine"
                              android:padding="10dp"
                              android:scrollbars="vertical"
                              android:textColor="@color/white_primary"
                              android:textColorHint="@color/white_tertiary"
                              android:textSize="10sp"
                              android:fontFamily="monospace"
                              android:hint="{&#10;  &quot;app_name&quot;: &quot;Samsung&quot;&#10;}" />

                          <LinearLayout
                              android:layout_width="match_parent"
                              android:layout_height="wrap_content"
                              android:layout_marginTop="9dp"
                              android:orientation="horizontal">

                              <com.google.android.material.button.MaterialButton
                                  android:id="@+id/saveRulesButton"
                                  android:layout_width="wrap_content"
                                  android:layout_height="38dp"
                                  android:text="Save Rules"
                                  android:textAllCaps="false"
                                  android:textColor="@color/white_primary"
                                  android:textSize="11sp"
                                  app:backgroundTint="@color/purple_accent"
                                  app:cornerRadius="9dp"
                                  app:rippleColor="#55FFFFFF" />

                              <Space
                                  android:layout_width="7dp"
                                  android:layout_height="1dp" />

                              <com.google.android.material.button.MaterialButton
                                  android:id="@+id/openFilesButton"
                                  android:layout_width="wrap_content"
                                  android:layout_height="38dp"
                                  android:text="Open in My Files"
                                  android:textAllCaps="false"
                                  android:textColor="@color/white_primary"
                                  android:textSize="11sp"
                                  app:backgroundTint="@color/oled_surface_alt"
                                  app:cornerRadius="9dp"
                                  app:strokeColor="@color/border_white_15"
                                  app:strokeWidth="1dp" />
                          </LinearLayout>
                      </LinearLayout>
                  </com.google.android.material.card.MaterialCardView>

                  <TextView
                      android:id="@+id/apiKeyLabel"
                      style="@style/SettingsSectionLabel"
                      android:layout_width="match_parent"
                      android:layout_height="wrap_content"
                      android:text="GEMINI API KEY"
                      android:layout_marginBottom="7dp" />

                  <EditText
                      android:id="@+id/apiKeyEditText"
                      style="@style/SettingsInputText"
                      android:layout_width="match_parent"
                      android:layout_height="43dp"
                      android:layout_marginBottom="13dp"
                      android:background="@drawable/bg_input_field"
                      android:hint="AIzaSy..."
                      android:inputType="textPassword"
                      android:singleLine="true"
                      android:paddingStart="12dp"
                      android:paddingEnd="12dp"
                      android:importantForAutofill="no"
                      android:imeOptions="actionDone" />

                  <LinearLayout
                      android:layout_width="match_parent"
                      android:layout_height="wrap_content"
                      android:minHeight="57dp"
                      android:gravity="center_vertical"
                      android:orientation="horizontal">

                      <LinearLayout
                          android:layout_width="0dp"
                          android:layout_height="wrap_content"
                          android:layout_weight="1"
                          android:orientation="vertical">

                          <TextView
                              style="@style/SettingsRowTitle"
                              android:layout_width="match_parent"
                              android:layout_height="wrap_content"
                              android:text="Auto-Disconnect on Silence (4s)" />

                          <TextView
                              style="@style/SettingsRowSubtitle"
                              android:layout_width="match_parent"
                              android:layout_height="wrap_content"
                              android:layout_marginTop="2dp"
                              android:text="Automatically close after finishing action" />
                      </LinearLayout>

                      <androidx.appcompat.widget.SwitchCompat
                          android:id="@+id/autoDisconnectSwitch"
                          android:layout_width="wrap_content"
                          android:layout_height="wrap_content"
                          android:checked="false"
                          android:minWidth="52dp"
                          android:padding="0dp" />
                  </LinearLayout>

                  <LinearLayout
                      android:layout_width="match_parent"
                      android:layout_height="wrap_content"
                      android:minHeight="57dp"
                      android:gravity="center_vertical"
                      android:orientation="horizontal">

                      <LinearLayout
                          android:layout_width="0dp"
                          android:layout_height="wrap_content"
                          android:layout_weight="1"
                          android:orientation="vertical">

                          <TextView
                              style="@style/SettingsRowTitle"
                              android:layout_width="match_parent"
                              android:layout_height="wrap_content"
                              android:text="Auto-Connect on Launch" />

                          <TextView
                              style="@style/SettingsRowSubtitle"
                              android:layout_width="match_parent"
                              android:layout_height="wrap_content"
                              android:layout_marginTop="2dp"
                              android:text="Listen immediately when triggered" />
                      </LinearLayout>

                      <androidx.appcompat.widget.SwitchCompat
                          android:id="@+id/autoConnectSwitch"
                          android:layout_width="wrap_content"
                          android:layout_height="wrap_content"
                          android:checked="false"
                          android:minWidth="52dp"
                          android:padding="0dp" />
                  </LinearLayout>

                  <LinearLayout
                      android:layout_width="match_parent"
                      android:layout_height="wrap_content"
                      android:minHeight="57dp"
                      android:gravity="center_vertical"
                      android:orientation="horizontal">

                      <LinearLayout
                          android:layout_width="0dp"
                          android:layout_height="wrap_content"
                          android:layout_weight="1"
                          android:orientation="vertical">

                          <TextView
                              style="@style/SettingsRowTitle"
                              android:layout_width="match_parent"
                              android:layout_height="wrap_content"
                              android:text="Speaker Echo Guard" />

                          <TextView
                              style="@style/SettingsRowSubtitle"
                              android:layout_width="match_parent"
                              android:layout_height="wrap_content"
                              android:layout_marginTop="2dp"
                              android:text="Prevents speaker feedback acoustic loop" />
                      </LinearLayout>

                      <androidx.appcompat.widget.SwitchCompat
                          android:id="@+id/speakerEchoGuardSwitch"
                          android:layout_width="wrap_content"
                          android:layout_height="wrap_content"
                          android:checked="true"
                          android:minWidth="52dp"
                          android:padding="0dp" />
                  </LinearLayout>

                  <LinearLayout
                      android:layout_width="match_parent"
                      android:layout_height="wrap_content"
                      android:minHeight="57dp"
                      android:gravity="center_vertical"
                      android:orientation="horizontal"
                      android:layout_marginBottom="13dp">

                      <LinearLayout
                          android:layout_width="0dp"
                          android:layout_height="wrap_content"
                          android:layout_weight="1"
                          android:orientation="vertical">

                          <TextView
                              style="@style/SettingsRowTitle"
                              android:layout_width="match_parent"
                              android:layout_height="wrap_content"
                              android:text="Bluetooth Priority Mode" />

                          <TextView
                              style="@style/SettingsRowSubtitle"
                              android:layout_width="match_parent"
                              android:layout_height="wrap_content"
                              android:layout_marginTop="2dp"
                              android:text="Keep audio on media speaker" />
                      </LinearLayout>

                      <androidx.appcompat.widget.SwitchCompat
                          android:id="@+id/bluetoothPrioritySwitch"
                          android:layout_width="wrap_content"
                          android:layout_height="wrap_content"
                          android:checked="true"
                          android:minWidth="52dp"
                          android:padding="0dp" />
                  </LinearLayout>

                  <TextView
                      android:id="@+id/instructionsLabel"
                      style="@style/SettingsSectionLabel"
                      android:layout_width="match_parent"
                      android:layout_height="wrap_content"
                      android:text="ASSISTANT INSTRUCTIONS (JARVIS PROTOCOL)"
                      android:layout_marginBottom="7dp" />

                  <EditText
                      android:id="@+id/instructionsEditText"
                      style="@style/SettingsInputText"
                      android:layout_width="match_parent"
                      android:layout_height="92dp"
                      android:layout_marginBottom="15dp"
                      android:background="@drawable/bg_input_field"
                      android:gravity="top|start"
                      android:inputType="textMultiLine|textCapSentences"
                      android:maxLines="4"
                      android:minLines="4"
                      android:padding="10dp"
                      android:scrollbars="vertical"
                      android:text="You are Voice (Jarvis), an ultra-fast autonomous Android agent with physical device control and experiential memory."
                      android:textSize="11sp" />

                  <TextView
                      style="@style/SettingsSectionLabel"
                      android:layout_width="match_parent"
                      android:layout_height="wrap_content"
                      android:text="TARGET MODEL"
                      android:layout_marginBottom="6dp" />

                  <Spinner
                      android:id="@+id/modelSpinner"
                      android:layout_width="match_parent"
                      android:layout_height="47dp"
                      android:layout_marginBottom="15dp"
                      android:background="@drawable/bg_input_field"
                      android:paddingStart="10dp"
                      android:paddingEnd="10dp"
                      android:spinnerMode="dropdown" />

                  <TextView
                      style="@style/SettingsSectionLabel"
                      android:layout_width="match_parent"
                      android:layout_height="wrap_content"
                      android:text="VOICE PROFILE"
                      android:layout_marginBottom="6dp" />

                  <Spinner
                      android:id="@+id/voiceSpinner"
                      android:layout_width="match_parent"
                      android:layout_height="47dp"
                      android:layout_marginBottom="17dp"
                      android:background="@drawable/bg_input_field"
                      android:paddingStart="10dp"
                      android:paddingEnd="10dp"
                      android:spinnerMode="dropdown" />

                  <com.google.android.material.button.MaterialButton
                      android:id="@+id/saveButton"
                      android:layout_width="match_parent"
                      android:layout_height="48dp"
                      android:layout_marginBottom="4dp"
                      android:text="Save Configuration"
                      android:textAllCaps="false"
                      android:textColor="@color/white_primary"
                      android:textSize="13sp"
                      android:textStyle="bold"
                      app:backgroundTint="@color/purple_accent"
                      app:cornerRadius="12dp"
                      app:elevation="0dp"
                      app:rippleColor="#55FFFFFF" />
              </LinearLayout>
          </androidx.core.widget.NestedScrollView>
          EOF

          cat << 'EOF' > gradle.properties
          android.useAndroidX=true
          android.nonTransitiveRClass=true
          org.gradle.jvmargs=-Xmx2048m
          EOF

          cat << 'EOF' > build.gradle
          buildscript {
              repositories {
                  google()
                  mavenCentral()
              }
              dependencies {
                  classpath 'com.android.tools.build:gradle:8.2.2'
              }
          }
          allprojects {
              repositories {
                  google()
                  mavenCentral()
              }
          }
          EOF

          cat << 'EOF' > settings.gradle
          rootProject.name = "VoiceNative"
          include ':app'
          EOF

          cat << 'EOF' > app/build.gradle
          apply plugin: 'com.android.application'

          android {
              namespace 'com.gemini.live'
              compileSdk 34

              defaultConfig {
                  applicationId "com.gemini.live.native"
                  minSdk 24
                  targetSdk 34
                  versionCode 19
                  versionName "3.0"
              }
              buildTypes {
                  release {
                      minifyEnabled false
                  }
              }
          }

          dependencies {
              implementation 'androidx.appcompat:appcompat:1.6.1'
              implementation 'com.google.android.material:material:1.11.0'
              implementation 'com.squareup.okhttp3:okhttp:4.12.0'
          }
          EOF

          cat << 'EOF' > app/src/main/AndroidManifest.xml
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.INTERNET" />
              <uses-permission android:name="android.permission.RECORD_AUDIO" />
              <uses-permission android:name="android.permission.MODIFY_AUDIO_SETTINGS" />
              <uses-permission android:name="android.permission.CAMERA" />
              <uses-permission android:name="android.permission.FLASHLIGHT" />
              <uses-permission android:name="android.permission.VIBRATE" />
              <uses-permission android:name="android.permission.CALL_PHONE" />
              <uses-permission android:name="android.permission.SEND_SMS" />
              <uses-permission android:name="android.permission.READ_CONTACTS" />
              <uses-permission android:name="android.permission.READ_CALL_LOG" />
              <uses-permission android:name="android.permission.SYSTEM_ALERT_WINDOW" />
              <uses-permission android:name="android.permission.FOREGROUND_SERVICE" />
              <uses-permission android:name="android.permission.FOREGROUND_SERVICE_MEDIA_PROJECTION" />

              <application
                  android:label="Voice Native"
                  android:icon="@mipmap/ic_launcher"
                  android:hardwareAccelerated="true"
                  android:theme="@style/AppTheme">

                  <activity
                      android:name=".SettingsActivity"
                      android:exported="true"
                      android:theme="@style/AppTheme">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>

                  <service
                      android:name=".VolumeTriggerService"
                      android:permission="android.permission.BIND_ACCESSIBILITY_SERVICE"
                      android:exported="true">
                      <intent-filter>
                          <action android:name="android.accessibilityservice.AccessibilityService" />
                      </intent-filter>
                      <meta-data
                          android:name="android.accessibilityservice"
                          android:resource="@xml/accessibility_service_config" />
                  </service>

                  <service
                      android:name=".ScreenCaptureService"
