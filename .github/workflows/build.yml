              // Calibrated 288x592 Native Touch with Magnetic Snapping
              public boolean tapCoordinates(int x, int y) {
                  if (Build.VERSION.SDK_INT < Build.VERSION_CODES.N) return false;
                  WindowManager wm = (WindowManager) getSystemService(Context.WINDOW_SERVICE);
                  DisplayMetrics dm = new DisplayMetrics();
                  if (wm != null) wm.getDefaultDisplay().getRealMetrics(dm);
                  else dm = getResources().getDisplayMetrics();

                  int targetX = (x <= 1000 && y <= 1000) ? Math.round((x / 1000.0f) * dm.widthPixels) : x;
                  int targetY = (x <= 1000 && y <= 1000) ? Math.round((y / 1000.0f) * dm.heightPixels) : y;

                  AccessibilityNodeInfo root = getRootInActiveWindow();
                  if (root != null) {
                      Rect snapped = findNearbyElement(root, targetX, targetY, 35);
                      if (snapped != null) {
                          targetX = snapped.centerX();
                          targetY = snapped.centerY();
                      }
                  }

                  targetX = Math.max(5, Math.min(targetX, dm.widthPixels - 5));
                  targetY = Math.max(5, Math.min(targetY, dm.heightPixels - 5));

                  Path p = new Path();
                  p.moveTo(targetX, targetY);
                  p.lineTo(targetX, targetY + 2);
                  GestureDescription.StrokeDescription stroke = new GestureDescription.StrokeDescription(p, 0, 120);
                  GestureDescription.Builder b = new GestureDescription.Builder();
                  b.addStroke(stroke);

                  final int fX = targetX;
                  final int fY = targetY;
                  return dispatchGesture(b.build(), new GestureResultCallback() {
                      @Override
                      public void onCompleted(GestureDescription gestureDescription) {
                          super.onCompleted(gestureDescription);
                          showToast("✓ Tap at (" + fX + ", " + fY + ")");
                      }
                  }, null);
              }

              public boolean longPress(int x, int y) {
                  if (Build.VERSION.SDK_INT < Build.VERSION_CODES.N) return false;
                  WindowManager wm = (WindowManager) getSystemService(Context.WINDOW_SERVICE);
                  DisplayMetrics dm = new DisplayMetrics();
                  if (wm != null) wm.getDefaultDisplay().getRealMetrics(dm);
                  else dm = getResources().getDisplayMetrics();

                  int targetX = (x <= 1000 && y <= 1000) ? Math.round((x / 1000.0f) * dm.widthPixels) : x;
                  int targetY = (x <= 1000 && y <= 1000) ? Math.round((y / 1000.0f) * dm.heightPixels) : y;

                  targetX = Math.max(5, Math.min(targetX, dm.widthPixels - 5));
                  targetY = Math.max(5, Math.min(targetY, dm.heightPixels - 5));

                  Path p = new Path();
                  p.moveTo(targetX, targetY);
                  p.lineTo(targetX, targetY + 2);
                  GestureDescription.StrokeDescription stroke = new GestureDescription.StrokeDescription(p, 0, 700);
                  GestureDescription.Builder b = new GestureDescription.Builder();
                  b.addStroke(stroke);
                  return dispatchGesture(b.build(), null, null);
              }

              private Rect findNearbyElement(AccessibilityNodeInfo node, int x, int y, int radius) {
                  if (node == null) return null;
                  if (node.isClickable()) {
                      Rect r = new Rect();
                      node.getBoundsInScreen(r);
                      if (r.contains(x, y)) return r;
                      int dx = x - r.centerX(), dy = y - r.centerY();
                      if (Math.sqrt(dx * dx + dy * dy) <= radius) return r;
                  }
                  for (int i = 0; i < node.getChildCount(); i++) {
                      Rect res = findNearbyElement(node.getChild(i), x, y, radius);
                      if (res != null) return res;
                  }
                  return null;
              }

              public boolean tapElement(String label) {
                  AccessibilityNodeInfo root = getRootInActiveWindow();
                  if (root == null) return false;
                  String target = label.toLowerCase().trim();
                  List<AccessibilityNodeInfo> matches = new ArrayList<>();
                  collectMatches(root, target, matches, 0);
                  if (matches.isEmpty()) return false;

                  AccessibilityNodeInfo best = null;
                  int minArea = Integer.MAX_VALUE;
                  Rect r = new Rect();
                  for (AccessibilityNodeInfo n : matches) {
                      n.getBoundsInScreen(r);
                      int area = r.width() * r.height();
                      if (area > 0 && area < minArea) {
                          minArea = area;
                          best = n;
                      }
                  }
                  if (best != null) {
                      best.getBoundsInScreen(r);
                      return tapCoordinates(r.centerX(), r.centerY());
                  }
                  return false;
              }

              private void collectMatches(AccessibilityNodeInfo node, String target, List<AccessibilityNodeInfo> list, int depth) {
                  if (node == null || depth > 25) return;
                  CharSequence text = node.getText();
                  CharSequence desc = node.getContentDescription();
                  boolean match = (text != null && text.toString().toLowerCase().contains(target)) ||
                                  (desc != null && desc.toString().toLowerCase().contains(target));
                  if (match) list.add(node);
                  for (int i = 0; i < node.getChildCount(); i++) collectMatches(node.getChild(i), target, list, depth + 1);
              }

              public boolean scroll(String direction) {
                  WindowManager wm = (WindowManager) getSystemService(Context.WINDOW_SERVICE);
                  DisplayMetrics dm = new DisplayMetrics();
                  if (wm != null) wm.getDefaultDisplay().getRealMetrics(dm);
                  else dm = getResources().getDisplayMetrics();

                  int midX = dm.widthPixels / 2;
                  int h = dm.heightPixels;
                  Path p = new Path();
                  if ("up".equalsIgnoreCase(direction)) {
                      p.moveTo(midX, (int)(h * 0.3)); p.lineTo(midX, (int)(h * 0.8));
                  } else {
                      p.moveTo(midX, (int)(h * 0.8)); p.lineTo(midX, (int)(h * 0.3));
                  }
                  GestureDescription.StrokeDescription stroke = new GestureDescription.StrokeDescription(p, 0, 300);
                  GestureDescription.Builder b = new GestureDescription.Builder();
                  b.addStroke(stroke);
                  return dispatchGesture(b.build(), null, null);
              }

              public String readScreenText() {
                  AccessibilityNodeInfo root = getRootInActiveWindow();
                  if (root == null) return "No active window.";

                  WindowManager wm = (WindowManager) getSystemService(Context.WINDOW_SERVICE);
                  DisplayMetrics dm = new DisplayMetrics();
                  if (wm != null) wm.getDefaultDisplay().getRealMetrics(dm);
                  else dm = getResources().getDisplayMetrics();

                  StringBuilder sb = new StringBuilder();
                  sb.append("=== INTERACTIVE ELEMENTS (0-1000) ===\n");
                  List<String> elements = new ArrayList<>();
                  extractInteractive(root, elements, dm, 0);
                  for (String e : elements) sb.append(e).append("\n");

                  sb.append("\n=== SCREEN TEXT ===\n");
                  extractText(root, sb, 0);
                  return sb.toString().trim();
              }

              private void extractInteractive(AccessibilityNodeInfo node, List<String> list, DisplayMetrics dm, int depth) {
                  if (node == null || depth > 25 || list.size() >= 25) return;
                  if (node.isClickable() || node.isEditable()) {
                      CharSequence text = node.getText();
                      CharSequence desc = node.getContentDescription();
                      String label = text != null ? text.toString().trim() : (desc != null ? desc.toString().trim() : "");
                      if (!label.isEmpty()) {
                          Rect r = new Rect();
                          node.getBoundsInScreen(r);
                          if (r.width() > 5 && r.height() > 5) {
                              int normX = Math.round((r.centerX() / (float) dm.widthPixels) * 1000);
                              int normY = Math.round((r.centerY() / (float) dm.heightPixels) * 1000);
                              list.add("[" + (node.isEditable() ? "Input" : "Button") + "] \"" + label + "\" at (" + normX + ", " + normY + ")");
                          }
                      }
                  }
                  for (int i = 0; i < node.getChildCount(); i++) extractInteractive(node.getChild(i), list, dm, depth + 1);
              }

              private void extractText(AccessibilityNodeInfo node, StringBuilder sb, int depth) {
                  if (node == null || depth > 25) return;
                  CharSequence text = node.getText();
                  if (text != null && text.length() > 0) sb.append(text).append("\n");
                  else {
                      CharSequence desc = node.getContentDescription();
                      if (desc != null && desc.length() > 0) sb.append(desc).append("\n");
                  }
                  for (int i = 0; i < node.getChildCount(); i++) extractText(node.getChild(i), sb, depth + 1);
              }

              public String typeText(String text) {
                  AccessibilityNodeInfo root = getRootInActiveWindow();
                  if (root == null) return "No active window.";

                  AccessibilityNodeInfo target = root.findFocus(AccessibilityNodeInfo.FOCUS_INPUT);
                  if (target == null) target = findFirstEditable(root, 0);

                  if (target != null) {
                      ClipboardManager cm = (ClipboardManager) getSystemService(Context.CLIPBOARD_SERVICE);
                      if (cm != null) {
                          cm.setPrimaryClip(ClipData.newPlainText("text", text));
                      }
                      boolean ok = target.performAction(AccessibilityNodeInfo.ACTION_PASTE);
                      if (!ok) {
                          Bundle b = new Bundle();
                          b.putCharSequence(AccessibilityNodeInfo.ACTION_ARGUMENT_SET_TEXT_CHARSEQUENCE, text);
                          ok = target.performAction(AccessibilityNodeInfo.ACTION_SET_TEXT, b);
                      }
                      return ok ? "Typed text." : "Could not paste.";
                  }
                  return "No editable field found.";
              }

              private AccessibilityNodeInfo findFirstEditable(AccessibilityNodeInfo node, int depth) {
                  if (node == null || depth > 25) return null;
                  if (node.isEditable()) return node;
                  for (int i = 0; i < node.getChildCount(); i++) {
                      AccessibilityNodeInfo res = findFirstEditable(node.getChild(i), depth + 1);
                      if (res != null) return res;
                  }
                  return null;
              }

              public String createNote(String text) {
                  try {
                      Intent intent = new Intent(Intent.ACTION_SEND);
                      intent.setType("text/plain");
                      intent.putExtra(Intent.EXTRA_TEXT, text);
                      intent.addFlags(Intent.FLAG_ACTIVITY_NEW_TASK);
                      startActivity(Intent.createChooser(intent, "Note"));
                      return "Note composer opened with text.";
                  } catch (Exception e) { return "Note error: " + e.getMessage(); }
              }

              public String searchYouTube(String query) {
                  try {
                      Intent intent = new Intent(Intent.ACTION_SEARCH);
                      intent.setPackage("com.google.android.youtube");
                      intent.putExtra("query", query);
                      intent.addFlags(Intent.FLAG_ACTIVITY_NEW_TASK);
                      startActivity(intent);
                      return "Searching YouTube.";
                  } catch (Exception e) {
                      Intent web = new Intent(Intent.ACTION_VIEW, Uri.parse("https://www.youtube.com/results?search_query=" + Uri.encode(query)));
                      web.addFlags(Intent.FLAG_ACTIVITY_NEW_TASK);
                      startActivity(web);
                      return "Opened YouTube in browser.";
                  }
              }

              public String searchWeb(String query) {
                  try {
                      Intent intent = new Intent(Intent.ACTION_WEB_SEARCH);
                      intent.putExtra("query", query);
                      intent.addFlags(Intent.FLAG_ACTIVITY_NEW_TASK);
                      startActivity(intent);
                      return "Searching Google.";
                  } catch (Exception e) { return "Search failed."; }
              }

              public String openWhatsApp(String phone, String msg) {
                  try {
                      String clean = phone.replaceAll("[^0-9+]", "");
                      if (clean.startsWith("+")) clean = clean.substring(1);
                      String url = "https://api.whatsapp.com/send?phone=" + clean + "&text=" + Uri.encode(msg);
                      Intent intent = new Intent(Intent.ACTION_VIEW, Uri.parse(url));
                      intent.setPackage("com.whatsapp");
                      intent.addFlags(Intent.FLAG_ACTIVITY_NEW_TASK);
                      startActivity(intent);
                      return "Opened WhatsApp chat.";
                  } catch (Exception e) { return "WhatsApp error: " + e.getMessage(); }
              }

              public String openApp(String appName) {
                  PackageManager pm = getPackageManager();
                  List<ApplicationInfo> apps = pm.getInstalledApplications(PackageManager.GET_META_DATA);
                  for (ApplicationInfo a : apps) {
                      String label = pm.getApplicationLabel(a).toString().toLowerCase();
                      if (label.contains(appName.toLowerCase().trim())) {
                          Intent launch = pm.getLaunchIntentForPackage(a.packageName);
                          if (launch != null) {
                              launch.addFlags(Intent.FLAG_ACTIVITY_NEW_TASK);
                              startActivity(launch);
                              return "Opened " + label;
                          }
                      }
                  }
                  return "App not found.";
              }

              public String makePhoneCall(String num) {
                  try {
                      Intent call = new Intent(Intent.ACTION_CALL, Uri.parse("tel:" + num.trim()));
                      call.addFlags(Intent.FLAG_ACTIVITY_NEW_TASK);
                      startActivity(call);
                      return "Calling " + num;
                  } catch (Exception e) { return "Call failed: " + e.getMessage(); }
              }

              public String searchContacts(String q) {
                  try {
                      android.content.ContentResolver cr = getContentResolver();
                      Uri uri = android.provider.ContactsContract.CommonDataKinds.Phone.CONTENT_URI;
                      String sel = android.provider.ContactsContract.CommonDataKinds.Phone.DISPLAY_NAME + " LIKE ?";
                      android.database.Cursor cur = cr.query(uri, new String[]{
                          android.provider.ContactsContract.CommonDataKinds.Phone.DISPLAY_NAME,
                          android.provider.ContactsContract.CommonDataKinds.Phone.NUMBER
                      }, sel, new String[]{"%" + q.trim() + "%"}, null);
                      if (cur != null) {
                          StringBuilder res = new StringBuilder();
                          while (cur.moveToNext()) {
                              res.append(cur.getString(0)).append(": ").append(cur.getString(1)).append("\n");
                              if (res.length() > 200) break;
                          }
                          cur.close();
                          return res.length() > 0 ? res.toString() : "No contact found.";
                      }
                  } catch (Exception e) { return "Contact search failed."; }
                  return "No contacts.";
              }

              public String toggleFlashlight(boolean state) {
                  try {
                      CameraManager cm = (CameraManager) getSystemService(Context.CAMERA_SERVICE);
                      if (cm != null) {
                          cm.setTorchMode(cm.getCameraIdList()[0], state);
                          return "Flashlight " + (state ? "ON" : "OFF");
                      }
                  } catch (Exception ignored) {}
                  return "Flashlight failed.";
              }

              @Override
              public void onAccessibilityEvent(AccessibilityEvent event) {}

              @Override
              public void onInterrupt() {}
          }
