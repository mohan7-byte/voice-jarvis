          package com.gemini.live;

          import android.media.AudioFormat;
          import android.media.AudioManager;
          import android.media.AudioRecord;
          import android.media.AudioTrack;
          import android.media.MediaRecorder;
          import android.util.Base64;

          public class AudioEngine {
              public interface AudioChunkListener {
                  void onAudioChunk(String base64Pcm);
                  void onUserSpeakingDetected();
              }

              private AudioRecord audioRecord;
              private AudioTrack audioTrack;
              private Thread recordThread;
              private boolean isRecording = false;
              private boolean isMuted = false;
              private boolean isModelSpeaking = false;
              private AudioChunkListener listener;

              public AudioEngine(AudioChunkListener listener) {
                  this.listener = listener;
                  initAudioTrack();
              }

              private void initAudioTrack() {
                  int minBuf = AudioTrack.getMinBufferSize(24000, AudioFormat.CHANNEL_OUT_MONO, AudioFormat.ENCODING_PCM_16BIT);
                  audioTrack = new AudioTrack(AudioManager.STREAM_MUSIC, 24000, 
                      AudioFormat.CHANNEL_OUT_MONO, AudioFormat.ENCODING_PCM_16BIT, 
                      Math.max(minBuf, 4096), AudioTrack.MODE_STREAM);
                  audioTrack.play();
              }

              public void startRecording() {
                  if (isRecording) return;
                  int minBuf = AudioRecord.getMinBufferSize(16000, AudioFormat.CHANNEL_IN_MONO, AudioFormat.ENCODING_PCM_16BIT);
                  try {
                      audioRecord = new AudioRecord(MediaRecorder.AudioSource.MIC, 16000, 
                          AudioFormat.CHANNEL_IN_MONO, AudioFormat.ENCODING_PCM_16BIT, 
                          Math.max(minBuf, 2048));
                      audioRecord.startRecording();
                      isRecording = true;

                      recordThread = new Thread(() -> {
                          byte[] buffer = new byte[1024];
                          while (isRecording) {
                              int read = audioRecord.read(buffer, 0, buffer.length);
                              if (read > 0 && !isMuted && !isModelSpeaking) {
                                  long sum = 0;
                                  for (int i = 0; i < read; i += 2) {
                                      short val = (short) ((buffer[i + 1] << 8) | (buffer[i] & 0xFF));
                                      sum += val * val;
                                  }
                                  double rms = Math.sqrt(sum / (read / 2.0));
                                  if (rms > 600 && listener != null) {
                                      listener.onUserSpeakingDetected();
                                  }
                                  String b64 = Base64.encodeToString(buffer, 0, read, Base64.NO_WRAP);
                                  if (listener != null) listener.onAudioChunk(b64);
                              }
                          }
                      });
                      recordThread.setPriority(Thread.MAX_PRIORITY);
                      recordThread.start();
                  } catch (Exception ignored) {}
              }

              public void stopRecording() {
                  isRecording = false;
                  if (recordThread != null) {
                      recordThread.interrupt();
                      recordThread = null;
                  }
                  if (audioRecord != null) {
                      try { audioRecord.stop(); audioRecord.release(); } catch (Exception ignored) {}
                      audioRecord = null;
                  }
              }

              public void playPcmChunk(byte[] pcmBytes) {
                  if (audioTrack != null && pcmBytes != null && pcmBytes.length > 0) {
                      isModelSpeaking = true;
                      audioTrack.write(pcmBytes, 0, pcmBytes.length);
                  }
              }

              public void stopPlayback() {
                  if (audioTrack != null) {
                      try {
                          audioTrack.pause();
                          audioTrack.flush();
                          audioTrack.play();
                      } catch (Exception ignored) {}
                  }
                  isModelSpeaking = false;
              }

              public void setModelSpeaking(boolean speaking) { this.isModelSpeaking = speaking; }
              public boolean isModelSpeaking() { return isModelSpeaking; }
              public void setMuted(boolean muted) { this.isMuted = muted; }
              public boolean isMuted() { return isMuted; }

              public void release() {
                  stopRecording();
                  if (audioTrack != null) {
                      try { audioTrack.stop(); audioTrack.release(); } catch (Exception ignored) {}
                      audioTrack = null;
                  }
              }
          }
